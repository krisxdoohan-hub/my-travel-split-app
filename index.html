<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Travel Split - 旅行分帳</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <!-- UI Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: var(--bg);
            touch-action: manipulation; 
        }

        .safe-top { @apply pt-[max(env(safe-area-inset-top),1.5rem)]; }
        .safe-bottom { @apply pb-[max(env(safe-area-inset-bottom),1.5rem)]; }
        
        .glass { @apply bg-white/90 backdrop-blur-xl border-b border-slate-100; }
        .card { @apply bg-white border border-slate-100 rounded-2xl shadow-sm overflow-hidden transition-all; }

        .calc-btn {
            @apply flex items-center justify-center p-4 text-xl font-medium rounded-xl transition-all active:scale-90 bg-slate-50 border border-slate-100 text-slate-700 select-none;
        }
        .calc-btn-op { @apply bg-indigo-600 text-white border-none active:bg-indigo-700; }

        .view { @apply hidden flex-col transition-all duration-300; }
        .view.active { @apply flex animate-[fadeIn_0.3s_ease-out]; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .day-tab { @apply px-4 py-2 rounded-full text-xs font-bold transition-all whitespace-nowrap; }
        .day-tab.active { @apply bg-indigo-600 text-white shadow-md shadow-indigo-100; }
        .day-tab.inactive { @apply bg-white text-slate-400 border border-slate-100; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input:focus { outline: none; }
        
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-indigo-100">

    <!-- Header -->
    <header id="app-header" class="glass sticky top-0 z-50 w-full hidden">
        <div class="max-w-lg mx-auto px-5 safe-top pb-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                    <i class="fa-solid fa-wallet text-white"></i>
                </div>
                <h1 class="text-lg font-black tracking-tight text-slate-800">隨手記帳本</h1>
            </div>
            <div class="flex items-center gap-1">
                <button onclick="quickUpload()" class="p-2 w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 transition-colors group relative" id="cloud-status-btn" title="雲端同步狀態">
                    <i id="cloud-status-icon" class="fa-solid fa-cloud text-slate-300 text-lg transition-colors"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col p-4 mb-24 max-w-lg mx-auto w-full">
        
        <!-- Setup View -->
        <section id="view-setup" class="view flex-col items-center justify-center space-y-6 min-h-[70vh]">
            <div class="text-center space-y-3">
                <div class="w-24 h-24 bg-indigo-50 rounded-[2rem] flex items-center justify-center mx-auto mb-4 shadow-inner">
                    <i class="fa-solid fa-users text-5xl text-indigo-600"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-800">旅程開始</h2>
                <p class="text-slate-400 font-medium">請設定參與人數與專屬密碼</p>
            </div>

            <div class="w-full space-y-6">
                <div class="flex items-center justify-center gap-4 bg-white p-4 rounded-3xl shadow-sm border border-slate-100 mx-8">
                    <button onclick="changePersonCount(-1)" class="w-12 h-12 rounded-full bg-slate-50 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition-colors flex items-center justify-center font-black text-xl active:scale-90">-</button>
                    <div class="flex-1 flex items-center justify-center gap-1">
                        <input type="number" id="setup-person-count" value="1" min="1" onchange="setPersonCount(parseInt(this.value))" class="w-16 text-center text-4xl font-black text-slate-800 bg-transparent outline-none p-0">
                        <span class="text-lg font-bold text-slate-400 mb-[-10px]">人</span>
                    </div>
                    <button onclick="changePersonCount(1)" class="w-12 h-12 rounded-full bg-slate-50 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition-colors flex items-center justify-center font-black text-xl active:scale-90">+</button>
                </div>

                <div id="nickname-inputs" class="hidden animate-[fadeIn_0.5s] relative">
                    <div class="max-h-[45vh] overflow-y-auto scrollbar-hide pb-24 px-1" id="name-container-wrapper">
                        <div id="name-container" class="grid grid-cols-1 gap-3"></div>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-slate-50 via-slate-50/90 to-transparent">
                        <button onclick="startTrip()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-xl shadow-indigo-200 active:scale-95 transition-all text-lg">
                            即刻出發
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="view-login" class="view flex-col items-center justify-center space-y-8 min-h-[70vh]">
            <div class="text-center space-y-3 w-full">
                <div class="w-24 h-24 bg-amber-50 rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-inner">
                    <i class="fa-solid fa-lock text-5xl text-amber-500"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800">身分驗證</h2>
                <p class="text-slate-400 font-medium">請選擇您的名字並輸入專屬密碼</p>
            </div>
            
            <div class="w-full bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-5">
                <div class="relative">
                    <select id="login-member-select" class="w-full bg-slate-50 border border-slate-200 text-slate-700 font-bold text-lg py-4 pl-4 pr-10 rounded-xl appearance-none focus:outline-none focus:border-indigo-300">
                        </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                        <i class="fa-solid fa-caret-down"></i>
                    </div>
                </div>
                
                <input type="password" id="login-password" placeholder="輸入 4 位數專屬密碼" maxlength="4" pattern="[0-9]*" inputmode="numeric" class="w-full bg-slate-50 border border-slate-200 text-center tracking-[0.5em] font-black text-xl py-4 rounded-xl focus:outline-none focus:border-amber-300">
                
                <button onclick="verifyLogin()" class="w-full py-4 bg-amber-500 text-white rounded-xl font-black shadow-lg shadow-amber-200 active:scale-95 transition-all text-lg">
                    解鎖進入帳本
                </button>
            </div>
        </section>

        <!-- Main View -->
        <section id="view-main" class="view flex-col space-y-6">
            
            <!-- 公費餘額儀表板 (支援多幣別橫向滑動) -->
            <div id="dashboard-public-fund-container" class="flex gap-4 overflow-x-auto snap-x snap-mandatory scrollbar-hide mt-2 pb-2">
                <!-- JS 動態生成不同幣別的卡片 -->
            </div>

            <!-- 篩選器與總覽標題 -->
            <div class="flex items-center justify-between mt-2 px-1">
                <div>
                    <p class="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-1">目前篩選</p>
                    <p id="current-day-label" class="text-2xl font-black text-slate-800">全部明細</p>
                </div>
                <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-layer-group text-slate-400"></i>
                </div>
            </div>

            <div id="day-selector" class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide py-1"></div>

            <div id="member-summary-container" class="hidden">
                <div class="flex items-center justify-between mb-2 px-1">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-filter text-indigo-600 text-xl"></i>
                        <h2 class="text-lg font-bold text-gray-800">成員紀錄篩選</h2>
                    </div>
                </div>
                <div class="relative">
                    <select id="member-filter-select" onchange="toggleMemberFilter(this.value)" class="w-full bg-white border border-slate-200 text-slate-700 font-bold text-sm py-3.5 pl-4 pr-10 rounded-xl appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-300 shadow-sm transition-all cursor-pointer">
                        <option value="all">所有成員明細</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                        <i class="fa-solid fa-caret-down text-xs"></i>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2 mb-2 mt-4 px-1">
                <i class="fa-solid fa-clock-rotate-left text-indigo-600 text-xl"></i>
                <h2 class="text-lg font-bold text-gray-800">歷史明細紀錄</h2>
            </div>

            <div id="records-container" class="space-y-6"></div>
            <div id="empty-state" class="hidden flex-col items-center justify-center py-10 text-center space-y-4">
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-receipt text-4xl text-slate-300"></i>
                </div>
                <p class="text-slate-400 font-bold">目前沒有符合篩選條件的紀錄喔</p>
            </div>
        </section>

        <!-- Add/Edit View -->
        <section id="view-add" class="view flex-col space-y-6">
            <div class="flex items-center justify-between pt-2">
                <button onclick="showView('main')" class="w-10 h-10 rounded-full bg-white border border-slate-100 flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-chevron-left text-indigo-600"></i>
                </button>
                <h2 id="add-view-title" class="text-xl font-black text-slate-800">新增紀錄</h2>
                <div id="edit-indicator" class="hidden px-3 py-1 bg-amber-100 text-amber-700 text-[10px] font-black rounded-full">編輯中</div>
            </div>

            <div class="card p-6 space-y-6">
                <!-- 新增：收支切換開關 -->
                <div class="flex p-1 bg-slate-100 rounded-xl">
                    <button onclick="setFlowType('expense')" id="flow-expense" class="flex-1 py-2.5 text-sm font-black rounded-lg bg-white shadow-sm text-rose-600 transition-all">支出</button>
                    <button onclick="setFlowType('income')" id="flow-income" class="flex-1 py-2.5 text-sm font-black rounded-lg text-slate-400 hover:text-slate-600 transition-all">收入</button>
                </div>

                <div class="flex justify-between items-start">
                    <div class="space-y-1 w-full">
                        <label class="text-[10px] font-black text-slate-300 uppercase tracking-widest block">總金額</label>
                        <div class="flex items-baseline gap-1">
                            <span id="amount-currency-symbol" class="text-3xl font-black text-rose-300">$</span>
                            <div id="amount-display" class="text-5xl font-black text-rose-500 tabular-nums overflow-hidden text-ellipsis flex-1">0</div>
                        </div>
                    </div>
                    <div class="shrink-0 relative mt-1">
                        <select id="currency-select" class="bg-indigo-50 text-indigo-600 font-bold text-sm py-2 pl-3 pr-8 rounded-xl border border-indigo-100 focus:outline-none focus:ring-2 focus:ring-indigo-300 appearance-none cursor-pointer" onchange="updateCurrencySymbol()">
                            <option value="TWD">新台幣</option>
                            <option value="JPY">日幣</option>
                            <option value="KRW">韓幣</option>
                            <option value="HKD">港幣</option>
                            <option value="USD">美金</option>
                            <option value="CNY">人民幣</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-indigo-500">
                            <i class="fa-solid fa-caret-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-300 uppercase tracking-widest">日期</label>
                        <input type="date" id="item-date" class="w-full py-3 text-sm font-bold border-b-2 border-slate-50 focus:border-indigo-100 transition-all text-slate-700 bg-transparent">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-300 uppercase tracking-widest">項目名稱</label>
                        <input type="text" id="item-title" placeholder="例如：餐點..." class="w-full py-3 text-sm font-bold border-b-2 border-slate-50 focus:border-indigo-100 transition-all">
                    </div>
                </div>

                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-camera text-slate-400"></i>
                        <span class="text-xs font-bold text-slate-600">收據/發票照片</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div id="photo-preview-container" class="hidden relative w-10 h-10 rounded-lg overflow-hidden border border-slate-200">
                            <img id="photo-preview" src="" class="w-full h-full object-cover">
                            <button onclick="removePhoto()" class="absolute -top-1 -right-1 w-4 h-4 bg-rose-500 text-white rounded-full flex items-center justify-center text-[8px]"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <label class="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-[10px] font-bold text-indigo-600 shadow-sm active:scale-95 transition-all cursor-pointer">
                            上傳圖片
                            <input type="file" accept="image/*" class="hidden" id="photo-upload-input" onchange="handlePhotoUpload(event)">
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 p-1.5 bg-slate-50 rounded-2xl" id="split-toggle-container">
                    <button onclick="setExpenseType('single')" id="type-single" class="py-3 rounded-xl font-black text-xs transition-all">單人</button>
                    <button onclick="setExpenseType('multi')" id="type-multi" class="py-3 rounded-xl font-black text-xs transition-all">均分</button>
                    <button onclick="setExpenseType('custom')" id="type-custom" class="py-3 rounded-xl font-black text-xs transition-all">個別</button>
                </div>

                <!-- 更新：付款方式新增公費 -->
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setPayMethod('cash')" id="pay-cash" class="py-4 rounded-xl border-2 font-black text-xs flex flex-col items-center justify-center gap-1.5">
                        <i class="fa-solid fa-coins text-lg"></i> 現金
                    </button>
                    <button onclick="setPayMethod('credit')" id="pay-credit" class="py-4 rounded-xl border-2 font-black text-xs flex flex-col items-center justify-center gap-1.5">
                        <i class="fa-solid fa-credit-card text-lg"></i> 信用卡
                    </button>
                    <button onclick="setPayMethod('public')" id="pay-public" class="py-4 rounded-xl border-2 font-black text-xs flex flex-col items-center justify-center gap-1.5">
                        <i class="fa-solid fa-piggy-bank text-lg"></i> 公費
                    </button>
                </div>

                <div class="space-y-3">
                    <label class="text-[10px] font-black text-slate-300 uppercase tracking-widest" id="payer-label">是誰處理這筆款項的？</label>
                    <div id="payer-grid" class="flex flex-wrap gap-2"></div>
                </div>

                <div id="split-info" class="p-4 bg-indigo-50 border border-indigo-100 rounded-2xl hidden">
                    <div class="flex justify-between items-center">
                        <span class="text-indigo-600 text-xs font-black uppercase tracking-wider">每位夥伴金額</span>
                        <div class="flex items-baseline gap-1">
                            <span class="amount-currency-symbol-small text-indigo-400 text-sm font-bold">$</span>
                            <span id="avg-amount" class="text-indigo-700 font-black text-2xl">0</span>
                        </div>
                    </div>
                </div>

                <div id="custom-split-container" class="p-4 bg-indigo-50 border border-indigo-100 rounded-2xl hidden flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <span class="text-indigo-600 text-xs font-black uppercase tracking-wider">各人設定</span>
                        <span id="custom-split-diff" class="text-[10px] px-2 py-1 rounded font-bold bg-white text-slate-500 shadow-sm border border-slate-100">差額: 0</span>
                    </div>
                    <div id="custom-split-inputs" class="space-y-2"></div>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-2 mb-8">
                <button class="calc-btn" onclick="calcInput('7')">7</button>
                <button class="calc-btn" onclick="calcInput('8')">8</button>
                <button class="calc-btn" onclick="calcInput('9')">9</button>
                <button class="calc-btn text-red-500 font-black" onclick="calcInput('C')">C</button>
                <button class="calc-btn" onclick="calcInput('4')">4</button>
                <button class="calc-btn" onclick="calcInput('5')">5</button>
                <button class="calc-btn" onclick="calcInput('6')">6</button>
                <button class="calc-btn text-slate-400" onclick="calcInput('DEL')"><i class="fa-solid fa-delete-left"></i></button>
                <button class="calc-btn" onclick="calcInput('1')">1</button>
                <button class="calc-btn" onclick="calcInput('2')">2</button>
                <button class="calc-btn" onclick="calcInput('3')">3</button>
                <button onclick="calcSave()" class="calc-btn calc-btn-op row-span-2"><i class="fa-solid fa-circle-check text-3xl"></i></button>
                <button class="calc-btn col-span-2 font-black" onclick="calcInput('0')">0</button>
                <button class="calc-btn font-black" onclick="calcInput('.')">.</button>
            </div>
        </section>

        <!-- Settings View -->
        <section id="view-settings" class="view flex-col space-y-6">
            <div class="flex items-center justify-between pt-2 mb-2">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-gear text-indigo-600 text-xl"></i>
                    <h2 class="text-xl font-black text-slate-800">系統設定</h2>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-[10px] font-black text-slate-400 bg-slate-100 px-2 py-1 rounded-md" id="app-version-label">v0.0.0</span>
                    <button onclick="showView('main')" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center hover:bg-slate-200 transition-colors">
                        <i class="fa-solid fa-xmark text-slate-500"></i>
                    </button>
                </div>
            </div>

            <div class="bg-[#f4f7fc] border border-blue-100 rounded-2xl p-5 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2 text-blue-700 font-bold">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <h3>GitHub 雲端備份</h3>
                    </div>
                    <i class="fa-solid fa-eye-slash text-blue-400 text-sm cursor-pointer hover:text-blue-600 transition-colors" onclick="toggleTokenVisibility()"></i>
                </div>
                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="gh-owner" placeholder="GitHub 帳號" class="w-full bg-white text-sm font-medium p-3 rounded-xl border border-blue-100 focus:border-blue-400 transition-all outline-none">
                        <input type="text" id="gh-repo" placeholder="儲存庫名稱" class="w-full bg-white text-sm font-medium p-3 rounded-xl border border-blue-100 focus:border-blue-400 transition-all outline-none">
                    </div>
                    <input type="password" id="gh-token" placeholder="GitHub Token (ghp_...)" class="w-full bg-white text-sm font-medium p-3 rounded-xl border border-blue-100 focus:border-blue-400 transition-all outline-none">
                    
                    <button onclick="saveGitHubConfig()" class="w-full py-3.5 bg-blue-600 text-white rounded-xl font-bold text-sm shadow-md shadow-blue-200 active:scale-[0.98] transition-all hover:bg-blue-700">
                        儲存金鑰並連接
                    </button>
                    
                    <div class="pt-3 border-t border-blue-200/60 mt-4 grid grid-cols-2 gap-3">
                        <button onclick="downloadFromGitHub()" class="py-3 bg-white border border-blue-200 text-blue-600 rounded-xl font-bold text-sm shadow-sm active:scale-[0.98] transition-all hover:bg-blue-50 flex justify-center items-center gap-2">
                            <i class="fa-solid fa-download"></i> 下載覆蓋
                        </button>
                        <button onclick="uploadToGitHub()" class="py-3 bg-white border border-blue-200 text-blue-600 rounded-xl font-bold text-sm shadow-sm active:scale-[0.98] transition-all hover:bg-blue-50 flex justify-center items-center gap-2">
                            <i class="fa-solid fa-upload"></i> 上傳覆蓋
                        </button>
                    </div>

                    <div id="invite-qr-container" class="hidden mt-4 pt-4 border-t border-blue-200/60 flex-col items-center space-y-3">
                        <p class="text-xs font-bold text-blue-600 uppercase tracking-widest">邀請夥伴掃描加入</p>
                        <div id="invite-qrcode" class="p-2 bg-white rounded-xl shadow-sm border border-blue-100"></div>
                        <p class="text-[10px] text-blue-400 text-center leading-relaxed">夥伴掃描後將自動載入帳本<br>基於資安，請勿將此條碼外流給非同行者</p>
                    </div>
                </div>
            </div>

            <div class="bg-slate-50 border border-slate-100 rounded-2xl p-5 shadow-sm">
                <div class="flex items-center gap-2 text-slate-700 font-bold mb-4">
                    <i class="fa-solid fa-server"></i>
                    <h3>本機手動 JSON</h3>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="exportLocalJSON()" class="py-3 bg-[#1e293b] text-white rounded-xl font-bold text-sm shadow-md active:scale-[0.98] transition-all hover:bg-slate-800 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-file-export"></i> 匯出備份
                    </button>
                    <label class="py-3 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold text-sm shadow-sm active:scale-[0.98] transition-all hover:bg-slate-50 flex justify-center items-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-file-import"></i> 匯入還原
                        <input type="file" id="local-json-import" accept=".json" class="hidden" onchange="importLocalJSON(event)">
                    </label>
                </div>
            </div>

            <div class="bg-rose-50 border border-rose-100 rounded-2xl p-5 shadow-sm mt-4">
                <div class="flex items-center gap-2 text-rose-700 font-bold mb-4">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <h3>危險操作區</h3>
                </div>
                <button onclick="endTrip()" class="w-full py-3.5 bg-rose-600 text-white rounded-xl font-black text-sm shadow-md shadow-rose-200 active:scale-[0.98] transition-all hover:bg-rose-700 flex justify-center items-center gap-2">
                    <i class="fa-solid fa-power-off"></i> 結束旅程並清空雲端
                </button>
                <p class="text-[10px] text-rose-500 mt-3 font-bold text-center">僅限主揪操作。執行後全體夥伴將自動解綁並銷毀明細。</p>
            </div>
        </section>
    </main>

    <!-- Navigation -->
    <nav id="app-footer" class="glass fixed bottom-0 left-0 right-0 z-50 hidden">
        <div class="flex justify-around items-center h-20 max-w-lg mx-auto safe-bottom">
            <button onclick="showView('main')" id="nav-main" class="p-3 transition-all rounded-2xl flex flex-col items-center gap-1">
                <i class="fa-solid fa-list text-2xl"></i>
                <span class="text-[10px] font-bold">明細</span>
            </button>
            <button onclick="showView('add')" class="w-16 h-16 bg-indigo-600 rounded-full flex items-center justify-center -mt-8 shadow-[0_8px_30px_rgba(79,70,229,0.4)] border-4 border-white active:scale-90 transition-all">
                <i class="fa-solid fa-plus text-3xl text-white"></i>
            </button>
            <button onclick="showView('settings')" id="nav-settings" class="p-3 transition-all rounded-2xl flex flex-col items-center gap-1">
                <i class="fa-solid fa-gear text-2xl"></i>
                <span class="text-[10px] font-bold">設定</span>
            </button>
        </div>
    </nav>

    <!-- Modal UI -->
    <div id="lightbox-modal" class="hidden fixed inset-0 bg-black/90 z-[70] items-center justify-center opacity-0 transition-opacity duration-300" onclick="closeLightbox()">
        <button class="absolute top-4 right-4 w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-white backdrop-blur-md">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>
        <img id="lightbox-img" src="" class="max-w-full max-h-[90vh] object-contain p-4 transform scale-95 transition-transform duration-300">
    </div>

    <div id="custom-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[60] items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-sm rounded-[2rem] p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="custom-modal-panel">
            <div class="flex flex-col items-center text-center space-y-4">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-3xl mb-2" id="modal-icon">
                    <i class="fa-solid fa-circle-exclamation"></i>
                </div>
                <h3 class="text-lg font-black text-slate-800" id="modal-title">系統提示</h3>
                <p id="modal-message" class="text-sm font-medium text-slate-500 whitespace-pre-line"></p>
                <div class="flex gap-3 w-full mt-4 pt-2">
                    <button id="modal-cancel" onclick="closeCustomModal()" class="flex-1 py-3.5 bg-slate-100 text-slate-500 rounded-xl font-bold transition-colors hover:bg-slate-200">取消</button>
                    <button id="modal-confirm" onclick="executeModalAction()" class="flex-1 py-3.5 bg-indigo-600 text-white rounded-xl font-bold transition-colors shadow-lg shadow-indigo-200 hover:bg-indigo-700">確定</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 【終極決策】：徹底廢除 Service Worker，將所有快取管家強制解僱，從此根絕 Android 破圖與連線阻擋
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }

        const APP_VERSION = '0.1.5';
        let pendingModalAction = null;

        // --- Core Application State ---
        // 新增 currentFlowType 支援收支分類
        let state = { 
            people: [], records: [], currentAmount: '0', 
            currentFlowType: 'expense', currentType: 'single', currentPayMethod: 'cash', 
            currentPayerId: null, currentCurrency: 'TWD', customSplits: {}, editingId: null, 
            selectedDay: 'all', selectedMemberId: null,
            currentPhoto: null // 新增照片暫存
        };
        let syncConfig = { owner: '', repo: '', token: '' };
        let hasAutoDownloaded = false; 
        let hasUnsyncedChanges = false; 

        const FILE_PATH = 'travel_split_data.json';

        // --- 影像壓縮與 Lightbox 工具 (方案 A) ---
        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        const maxSide = 600; // 限制最大邊長 600px 確保輕量化
                        if (width > height) { if (width > maxSide) { height *= maxSide / width; width = maxSide; } } 
                        else { if (height > maxSide) { width *= maxSide / height; height = maxSide; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.5)); // 輸出低品質 JPEG
                    };
                };
            });
        }

        async function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            showCustomModal('success', '照片處理與壓縮中...', null, '系統提示');
            const base64 = await compressImage(file);
            state.currentPhoto = base64;
            document.getElementById('photo-preview').src = base64;
            document.getElementById('photo-preview-container').classList.remove('hidden');
            closeCustomModal();
        }

        function removePhoto() {
            state.currentPhoto = null;
            document.getElementById('photo-preview').src = '';
            document.getElementById('photo-preview-container').classList.add('hidden');
            document.getElementById('photo-upload-input').value = '';
        }

        function openLightbox(base64Str) {
            const modal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-img');
            img.src = base64Str;
            modal.classList.remove('hidden'); modal.classList.add('flex');
            requestAnimationFrame(() => { modal.classList.remove('opacity-0'); img.classList.remove('scale-95'); });
        }

        function closeLightbox() {
            const modal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-img');
            modal.classList.add('opacity-0'); img.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); img.src = ''; }, 300);
        }

        window.onload = async () => {
            document.getElementById('app-version-label').innerText = `v${APP_VERSION}`;
            
            // --- 魔法機制：攔截並解析 QR Code 邀請網址參數 ---
            const urlParams = new URLSearchParams(window.location.search);
            const inviteCode = urlParams.get('invite');
            if (inviteCode) {
                try {
                    const decodedStr = decodeURIComponent(escape(atob(inviteCode)));
                    const inviteConfig = JSON.parse(decodedStr);
                    if (inviteConfig.owner && inviteConfig.repo && inviteConfig.token) {
                        
                        // 【蘋果 Safari 救援】：檢查是否已經綁定過相同金鑰，避免重複彈出下載視窗
                        const savedConfigStr = localStorage.getItem('travel_split_sync_config');
                        let alreadyBound = false;
                        if (savedConfigStr) {
                            const savedConfig = JSON.parse(savedConfigStr);
                            if (savedConfig.repo === inviteConfig.repo && savedConfig.token === inviteConfig.token && savedConfig.owner === inviteConfig.owner) {
                                alreadyBound = true;
                            }
                        }

                        if (!alreadyBound) {
                            syncConfig = inviteConfig;
                            localStorage.setItem('travel_split_sync_config', JSON.stringify({ ...syncConfig, hasUnsyncedChanges: false }));
                            localStorage.setItem('gh_token_global', syncConfig.token);
                            
                            // 【核心關鍵】：移除原本的網址清除邏輯！保留 ?invite= 參數。
                            // 這樣夥伴從 LINE 點擊「使用 Safari 開啟」時，網址才不會遺失金鑰！
                            
                            hasAutoDownloaded = true;
                            localStorage.removeItem('travel_split_my_id');
                            await downloadFromGitHub(false); 
                            return;  // ← 加上這一行！讓 QR 邀請流程完全交由 downloadFromGitHub 內部的 initApp() 處理
                        }
                    }
                } catch (e) {
                    console.error('邀請碼解析失敗', e);
                }
            }
            // --------------------------------------------------

            loadLocalState();
            loadSyncConfig();
            
            const globalToken = localStorage.getItem('gh_token_global');
            if (globalToken && !syncConfig.token) syncConfig.token = globalToken;

            if (syncConfig.owner && syncConfig.repo && syncConfig.token && !hasAutoDownloaded) {
                hasAutoDownloaded = true;
                await downloadFromGitHub(true); 
            }
            initApp();
        };

        function initApp() {
            // 情況一：完全沒有人員資料，導向建立旅程頁面
            if (state.people.length === 0) { 
                showView('setup'); 
                toggleNav(false); 
                setPersonCount(1); // 預設產出單人輸入框，支援個人記帳
                return; 
            }
            
            // 情況二：已有資料，檢查本機是否已通過密碼驗證 (密碼鎖防線)
            const myId = localStorage.getItem('travel_split_my_id');
            if (!myId) {
                // 未綁定身分，強制攔截並導向解鎖畫面
                const select = document.getElementById('login-member-select');
                select.innerHTML = state.people.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
                document.getElementById('login-password').value = '';
                showView('login');
                toggleNav(false);
                return;
            }

            // 情況三：身分驗證通過，進入主儀表板
            showView('main'); 
            toggleNav(true); 
            
            // 權限控管：僅主揪 (ID 為 '0') 能看到底部的「設定」按鈕
            const settingsBtn = document.getElementById('nav-settings');
            if (settingsBtn) {
                settingsBtn.style.display = (myId === '0') ? 'flex' : 'none';
            }

            document.getElementById('split-toggle-container').style.display = state.people.length <= 1 ? 'none' : 'grid';
            updateSummary(); renderDays(); renderRecords(); renderMemberSummary(); updateCloudStatusUI(); updatePublicFundDashboard();
        }

        // --- 產生專屬 QR Code 函式 ---
        function generateInviteQR() {
            const container = document.getElementById('invite-qr-container');
            const qrDiv = document.getElementById('invite-qrcode');
            qrDiv.innerHTML = ''; // 清空舊圖片
            
            // 確保金鑰三要素皆存在才產生條碼
            if (syncConfig.owner && syncConfig.repo && syncConfig.token) {
                const configStr = JSON.stringify(syncConfig);
                const encodedStr = btoa(unescape(encodeURIComponent(configStr)));
                
                // 組合出含有 ?invite= 參數的專屬網址 (加上 encodeURIComponent 修復蘋果 Safari 解析錯誤)
                const inviteUrl = `${window.location.origin}${window.location.pathname}?invite=${encodeURIComponent(encodedStr)}`;
                
                if (typeof QRCode !== 'undefined') {
                    new QRCode(qrDiv, {
                        text: inviteUrl,
                        width: 140,
                        height: 140,
                        colorDark : "#2563eb", 
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.L
                    });
                    container.classList.remove('hidden');
                    container.classList.add('flex');
                }
            } else {
                container.classList.add('hidden');
                container.classList.remove('flex');
            }
        }

        // --- App Lifecycle & Wake-up Detection ---
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && syncConfig.token) {
                // 背景喚醒時的安全防線：有未上傳資料先推雲端，無則抓取最新
                if (hasUnsyncedChanges) { await uploadToGitHub(true); } 
                else { await downloadFromGitHub(true); }
            }
        });

        // --- GitHub Repo Sync Logic ---
        async function downloadFromGitHub(isAuto = false) {
            const { owner, repo, token } = syncConfig;
            if (!owner || !repo || !token) { 
                if (!isAuto) { showView('settings'); showCustomModal('alert', '請先完成 GitHub 雲端備份設定。'); }
                return; 
            }

            try {
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/${FILE_PATH}`;
                const response = await fetch(`${url}?t=${Date.now()}`, { headers: { 'Authorization': `Bearer ${token}`, 'Cache-Control': 'no-cache' } });
                if (response.status === 404) { if (!isAuto) showCustomModal('alert', '雲端尚未建立備份檔案，請先執行「上傳覆蓋」。'); return; }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                
                if (content && content.people) {
    if (content.people.length === 0 && state.people.length > 0) {
        localStorage.removeItem('travel_split_state');
        localStorage.removeItem('travel_split_sync_config');
        localStorage.removeItem('gh_token_global');
        localStorage.removeItem('travel_split_my_id');
        showCustomModal('alert', '主揪已結束本次旅程並清空帳本。\n系統將自動為您清除本地紀錄並解除雲端綁定。', () => { location.reload(); }, '旅程結束');
        return;
    }

    // ✅ 無論資料有無變動，都先更新 state 和 localStorage
    state.people = content.people;
    state.records = content.records;
    saveLocalState(true);

    if (!isAuto) {
        // QR Code 邀請流程：顯示歡迎彈窗，按確定才進入
        showCustomModal('success', '已從雲端下載最新資料，歡迎加入帳本！', () => { initApp(); }, '下載完成');
    } else {
        // 自動背景同步：靜默更新，直接 initApp
        initApp();
    }
}
                    
                    if (!isAuto) {
                        showCustomModal('success', '已從雲端下載最新資料。', () => { initApp(); }, '下載完成');
                    }
                }
            } catch (error) { 
                // 【Android 終極救援】：如果舊版快取管家依然陰魂不散攔截了 API 導致 Failed to fetch，
                // 系統將自動強制重新整理網頁一次，徹底擺脫舊管家的糾纏！
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    if (!sessionStorage.getItem('sw_reloaded')) {
                        sessionStorage.setItem('sw_reloaded', 'true');
                        window.location.reload(true);
                        return;
                    }
                }
                if (!isAuto) showCustomModal('alert', `自動同步失敗：\n${error.message}`); 
            }
        }

        async function uploadToGitHub(isAuto = false) {
            const { owner, repo, token } = syncConfig;
            if (!owner || !repo || !token) { 
                if (!isAuto) { showView('settings'); showCustomModal('alert', '請先完成 GitHub 雲端備份設定。'); }
                return; 
            }
            const exportData = { version: APP_VERSION, timestamp: new Date().toISOString(), people: state.people, records: state.records };
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${FILE_PATH}`;
            const base64Content = btoa(unescape(encodeURIComponent(JSON.stringify(exportData, null, 2))));

            try {
                let currentSha = null;
                const getRes = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                if (getRes.ok) currentSha = (await getRes.json()).sha;
                const putRes = await fetch(url, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ message: "Sync from Travel Split App", content: base64Content, sha: currentSha }) });
                if (!putRes.ok) throw new Error(`PUT Error ${putRes.status}`);
                hasUnsyncedChanges = false; saveSyncStatus(); updateCloudStatusUI();
                if (!isAuto) showCustomModal('success', '資料已成功上傳並覆蓋雲端儲存庫。', null, '同步完成');
            } catch (error) { if (!isAuto) showCustomModal('alert', `上傳失敗：\n${error.message}`); }
        }

        async function quickUpload() { await uploadToGitHub(true); }

        // --- Settings Helpers ---
        async function saveGitHubConfig() {
            const owner = document.getElementById('gh-owner').value.trim(), repo = document.getElementById('gh-repo').value.trim(), token = document.getElementById('gh-token').value.trim();
            if (!owner && !repo && !token) { syncConfig = { owner: '', repo: '', token: '' }; saveSyncStatus(); updateCloudStatusUI(); showCustomModal('success', '雲端綁定已成功解除。'); return; }
            if (!owner || !repo || !token) { showCustomModal('alert', '請輸入完整的帳號、儲存庫與 Token，或將三者皆清空以解除綁定。'); return; }
            
            syncConfig = { owner, repo, token }; 
            saveSyncStatus(); 
            updateCloudStatusUI(); 
            
            // 【防呆機制】：綁定完金鑰後，若電腦裡已經有設定好的人數，立刻幫主揪自動上傳覆蓋！
            if (state.people.length > 0) {
                showCustomModal('success', '正在為您將「人員設定」同步至雲端...', null, '系統執行中');
                await uploadToGitHub(true);
                showCustomModal('success', '雲端備份已完成！\n現在可以請夥伴掃描下方 QR Code 了。');
            } else {
                showCustomModal('success', '連接設定已儲存。\nToken 已同步至共享區。');
            }
            generateInviteQR(); // 更新 QR Code
        }

        function loadSyncConfig() {
            const saved = localStorage.getItem('travel_split_sync_config');
            const globalToken = localStorage.getItem('gh_token_global');
            if (saved) { const parsed = JSON.parse(saved); syncConfig.owner = parsed.owner || ''; syncConfig.repo = parsed.repo || ''; syncConfig.token = parsed.token || globalToken || ''; hasUnsyncedChanges = parsed.hasUnsyncedChanges || false; } 
            else if (globalToken) { syncConfig.token = globalToken; }
        }

        function saveSyncStatus() {
            localStorage.setItem('travel_split_sync_config', JSON.stringify({ ...syncConfig, hasUnsyncedChanges }));
            if (syncConfig.token) localStorage.setItem('gh_token_global', syncConfig.token);
        }

        function updateCloudStatusUI() {
            const icon = document.getElementById('cloud-status-icon'); if (!icon) return;
            // 寫入 animate-pulse 達成背景同步時的橘燈呼吸效果
            icon.className = 'fa-solid text-lg transition-colors ' + (!syncConfig.token || !syncConfig.owner ? 'fa-cloud text-slate-300' : (hasUnsyncedChanges ? 'fa-cloud-arrow-up text-amber-500 animate-pulse' : 'fa-cloud text-emerald-500'));
        }

        function toggleTokenVisibility() { const input = document.getElementById('gh-token'); input.type = input.type === 'password' ? 'text' : 'password'; }

        // --- View & Navigation ---
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            document.querySelectorAll('nav button i, nav button span').forEach(el => el.classList.remove('text-indigo-600'));
            const activeNav = document.getElementById(`nav-${viewId}`);
            if (activeNav) activeNav.querySelectorAll('i, span').forEach(el => el.classList.add('text-indigo-600'));
            
            if (viewId === 'main') { state.editingId = null; renderDays(); renderRecords(); updateSummary(); renderMemberSummary(); updatePublicFundDashboard(); }
            else if (viewId === 'add') resetAddForm();
            else if (viewId === 'settings') { 
                document.getElementById('gh-owner').value = syncConfig.owner || ''; 
                document.getElementById('gh-repo').value = syncConfig.repo || ''; 
                document.getElementById('gh-token').value = syncConfig.token || ''; 
                generateInviteQR(); // 切換到設定頁時，自動產生 QR Code 圖片
            }
            window.scrollTo(0,0);
        }

        function toggleNav(show) { document.getElementById('app-header').style.display = show ? 'block' : 'none'; document.getElementById('app-footer').style.display = show ? 'block' : 'none'; }

        // --- Setup & Authentication Logic ---
        function changePersonCount(delta) {
            const input = document.getElementById('setup-person-count');
            let val = parseInt(input.value) || 1;
            val += delta;
            if (val < 1) val = 1;
            input.value = val;
            setPersonCount(val);
        }

        function setPersonCount(count) {
            if (!count || count < 1) count = 1;
            document.getElementById('setup-person-count').value = count;
            
            const container = document.getElementById('name-container'); 
            container.innerHTML = '';
            
            for (let i = 1; i <= count; i++) {
                // 自動產生 4 位數隨機密碼
                const randomPwd = Math.floor(1000 + Math.random() * 9000).toString();
                container.innerHTML += `
                <div class="bg-white border border-slate-100 p-3 rounded-2xl shadow-sm flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-black text-xs shrink-0">${i}</div>
                    <input type="text" placeholder="夥伴暱稱 ${i}" class="nickname-input flex-1 font-bold text-slate-700 bg-transparent outline-none placeholder:text-slate-300" data-id="${i-1}">
                    <div class="w-[1px] h-8 bg-slate-100"></div>
                    <div class="relative w-20 shrink-0">
                        <span class="absolute -top-3 left-1 text-[9px] font-black text-slate-400 bg-white px-1">專屬密碼</span>
                        <input type="text" value="${randomPwd}" class="password-input w-full font-black text-amber-500 text-center tracking-widest bg-transparent outline-none" data-id="${i-1}" maxlength="4" pattern="[0-9]*" inputmode="numeric">
                    </div>
                </div>`;
            }
            document.getElementById('nickname-inputs').classList.remove('hidden');
        }

        function startTrip() {
            const nameInputs = document.querySelectorAll('.nickname-input');
            const pwdInputs = document.querySelectorAll('.password-input');
            
            state.people = Array.from(nameInputs).map((input, idx) => ({ 
                id: input.dataset.id, 
                name: input.value.trim() || `夥伴 ${parseInt(input.dataset.id) + 1}`,
                password: pwdInputs[idx].value.trim() || '0000' // 將密碼綁定至人員資料
            }));
            
            // 主揪自己預設為夥伴 1 (id: '0')，自動放行並記憶
            localStorage.setItem('travel_split_my_id', '0');
            saveLocalState(false); 
            initApp();
        }

        function verifyLogin() {
            const selectedId = document.getElementById('login-member-select').value;
            const inputPwd = document.getElementById('login-password').value.trim();
            const targetPerson = state.people.find(p => p.id === selectedId);
            
            if (targetPerson && targetPerson.password === inputPwd) {
                // 密碼正確，將此設備永久綁定為該成員
                localStorage.setItem('travel_split_my_id', selectedId);
                showCustomModal('success', `歡迎回來，${targetPerson.name}！\n您的設備已成功解鎖並綁定。`, () => {
                    initApp();
                });
            } else {
                showCustomModal('alert', '密碼錯誤，請確認後重新輸入。');
                document.getElementById('login-password').value = '';
            }
        }

        function resetApp() {
            showCustomModal('confirm', '確定要重新開始並清除本機的所有紀錄與雲端綁定設定嗎？', () => { 
                localStorage.removeItem('travel_split_state'); localStorage.removeItem('travel_split_sync_config'); location.reload(); 
            });
        }

        async function endTrip() {
            const myId = localStorage.getItem('travel_split_my_id');
            if (myId !== '0') {
                showCustomModal('alert', '權限不足：\n只有主揪（夥伴 1）可以執行旅程結案與洗牌動作。');
                return;
            }
            
            showCustomModal('confirm', '【危險操作警告】\n確定要結束本次旅程嗎？\n這將會上傳一份空白資料覆蓋雲端，所有夥伴的手機將會自動解除綁定、銷毀所有明細。', async () => {
                
                // 1. 將本地資料清空為初始狀態
                state.people = [];
                state.records = [];
                
                // 2. 強制將這份空白母本上傳覆蓋 GitHub (銷毀雲端資料)
                if (syncConfig.token) {
                    await uploadToGitHub(true);
                }
                
                // 3. 徹底清空主揪本地的記憶體與金鑰
                localStorage.removeItem('travel_split_state'); 
                localStorage.removeItem('travel_split_sync_config'); 
                localStorage.removeItem('gh_token_global');
                localStorage.removeItem('travel_split_my_id');
                
                // 4. 無須等待，直接執行畫面重整，瞬間退回初始「選擇人數」畫面
                location.reload(); 
            }, '一鍵結案');
        }

        // --- Date & Currency Helpers ---
        function formatTabDate(dateStr, isSameYear, earliestDate) { const d = new Date(dateStr); return (isSameYear && dateStr !== earliestDate) ? `${d.getMonth()+1}/${d.getDate()}` : `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }
        function formatDisplayDate(dateStr) { const d = new Date(dateStr); return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`; }
        function getTodayForInput() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
        function formatDateForInput(dateStr) { const d = new Date(dateStr); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
        function getCurrencySymbol(code) { return { 'TWD': '$', 'JPY': '¥', 'KRW': '₩', 'HKD': 'HK$', 'USD': 'US$', 'CNY': 'CN¥' }[code] || '$'; }

        function updateCurrencySymbol() {
            const sym = getCurrencySymbol(document.getElementById('currency-select').value);
            document.getElementById('amount-currency-symbol').innerText = sym;
            document.querySelectorAll('.amount-currency-symbol-small').forEach(el => el.innerText = sym);
            renderCustomSplitInputs();
        }

        // --- Data Display Logic ---
        function setSelectedDay(date) { state.selectedDay = date; state.selectedMemberId = null; renderDays(); renderMemberSummary(); renderRecords(); updateSummary(); }

        function toggleMemberFilter(memberId) {
            if (memberId === 'all') { state.selectedMemberId = null; state.selectedDay = 'all'; }
            else { state.selectedMemberId = memberId; state.selectedDay = null; }
            renderDays(); renderMemberSummary(); renderRecords(); updateSummary();
        }

        function renderDays() {
            const container = document.getElementById('day-selector');
            const datesAsc = [...new Set(state.records.map(r => r.date))].sort((a,b) => new Date(a) - new Date(b));
            if (datesAsc.length === 0) { container.innerHTML = `<button onclick="setSelectedDay('all')" class="day-tab active">全部明細</button>`; return; }
            const isSameYear = datesAsc.map(d => new Date(d).getFullYear()).every((y,i,arr) => y === arr[0]);
            let html = `<button onclick="setSelectedDay('all')" class="day-tab ${state.selectedDay === 'all' && !state.selectedMemberId ? 'active' : 'inactive'}">全部明細</button>`;
            [...datesAsc].reverse().forEach(date => {
                html += `<button onclick="setSelectedDay('${date}')" class="day-tab ${state.selectedDay === date && !state.selectedMemberId ? 'active' : 'inactive'}">${formatTabDate(date, isSameYear, datesAsc[0])}</button>`;
            });
            container.innerHTML = html;
        }

       function renderMemberSummary() {
            const container = document.getElementById('member-summary-container'), select = document.getElementById('member-filter-select');
            if (state.people.length === 0 || state.records.length === 0) { container.classList.add('hidden'); return; }
            container.classList.remove('hidden');
            
            const myId = localStorage.getItem('travel_split_my_id');
            
            // 初始化容器
            let personExpenses = {}; 
            let personBalances = {}; 
            state.people.forEach(p => {
                personExpenses[p.id] = {};
                personBalances[p.id] = {};
            });
            
            state.records.forEach(r => {
                const curr = r.currency || 'TWD';
                const isCash = r.payMethod === 'cash';

                if (r.payMethod === 'public') return;
                
                if (r.flowType === 'income') {
                    if (r.payerId) {
                        personBalances[r.payerId][curr] = (personBalances[r.payerId][curr] || 0) + r.amount;
                    }
                    return; 
                }
                
                if (r.type === 'single' && r.payerId) {
                    personExpenses[r.payerId][curr] = (personExpenses[r.payerId][curr] || 0) + r.amount;
                    if (isCash) personBalances[r.payerId][curr] = (personBalances[r.payerId][curr] || 0) - r.amount;
                } else if (r.type === 'multi') {
                    const per = r.amount / state.people.length;
                    state.people.forEach(p => {
                        personExpenses[p.id][curr] = (personExpenses[p.id][curr] || 0) + per;
                        if (isCash) personBalances[p.id][curr] = (personBalances[p.id][curr] || 0) - per;
                    });
                } else if (r.type === 'custom' && r.customSplits) {
                    Object.entries(r.customSplits).forEach(([pid, amt]) => {
                        personExpenses[pid][curr] = (personExpenses[pid][curr] || 0) + amt;
                        if (isCash) personBalances[pid][curr] = (personBalances[pid][curr] || 0) - amt;
                    });
                }
            });
            
            let optionsHtml = `<option value="all">所有成員明細</option>`;
            
            state.people.forEach(p => {
                let displayTexts = [];
                const allCurrencies = new Set([...Object.keys(personExpenses[p.id]), ...Object.keys(personBalances[p.id])]);
                
                allCurrencies.forEach(curr => {
                    const expAmt = personExpenses[p.id][curr] || 0;
                    const balAmt = personBalances[p.id][curr] || 0;
                    
                    if (expAmt !== 0 || balAmt !== 0) {
                        const sym = getCurrencySymbol(curr);
                        const f = (n) => Number.isInteger(n) ? n.toLocaleString() : n.toLocaleString(undefined, {minimumFractionDigits: 2});
                        displayTexts.push(`${sym} 支出:${f(expAmt)} / 結餘:${f(balAmt)}`);
                    }
                });
                
                // 隱私隔離防線：非本人帳號強制遮蔽金額，僅顯示名字供篩選明細使用
                let summaryText = '';
                if (p.id === myId) {
                    summaryText = displayTexts.length > 0 ? `(${displayTexts.join(' | ')})` : `(無個人收支)`;
                } else {
                    summaryText = `(隱私保護，僅顯示本人金額)`;
                }
                
                optionsHtml += `<option value="${p.id}" ${state.selectedMemberId === p.id ? 'selected' : ''}>${p.name} ${summaryText}</option>`;
            });
            
            select.innerHTML = optionsHtml;
        }

        function updateSummary() {
            const label = document.getElementById('current-day-label');
            if (state.selectedMemberId) label.innerText = `${state.people.find(p=>p.id===state.selectedMemberId)?.name} 的明細`;
            else if (state.selectedDay === 'all') label.innerText = '全部明細';
            else label.innerText = `${state.selectedDay} 明細`;
        }

        function renderRecords() {
    const container = document.getElementById('records-container'), empty = document.getElementById('empty-state');
    let filtered = state.records;
    
    if (state.selectedMemberId) filtered = filtered.filter(r => r.payerId == state.selectedMemberId || r.type === 'multi' || (r.type === 'custom' && r.customSplits && r.customSplits[state.selectedMemberId] > 0));
    else if (state.selectedDay !== 'all') filtered = filtered.filter(r => r.date === state.selectedDay);
    
    if (filtered.length === 0) { container.innerHTML = ''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    
    const groups = filtered.reduce((acc, r) => { (acc[r.date] = acc[r.date] || []).push(r); return acc; }, {});
    
    container.innerHTML = Object.keys(groups).sort((a, b) => new Date(b) - new Date(a)).map(date => {
        return `<div class="mb-6"><div class="flex items-baseline gap-2 mb-3 px-1"><span class="text-2xl font-bold text-gray-800">${formatDisplayDate(date)}</span><span class="text-sm font-medium text-gray-400">${['週日','週一','週二','週三','週四','週五','週六'][new Date(date).getDay()]}</span></div><div class="space-y-3">` + 
        groups[date].map(r => {
            const isIncome = r.flowType === 'income';
            const colorVal = isIncome ? 'emerald' : 'rose';
            const sym = getCurrencySymbol(r.currency || 'TWD');
            const isShared = (r.type === 'multi' || r.type === 'custom') && state.people.length > 1;
            const payMethodName = r.payMethod === 'cash' ? '現金' : (r.payMethod === 'credit' ? '刷卡' : '公費');
            const payMethodColor = r.payMethod === 'cash' ? 'bg-amber-100 text-amber-700' : (r.payMethod === 'credit' ? 'bg-blue-100 text-blue-700' : 'bg-indigo-100 text-indigo-700');

            // 構建分帳成員區塊
            let sharedHtml = '';
            if (isShared) {
                const membersHtml = state.people.filter(p => p.id != r.payerId).map(p => {
                    if (r.type === 'custom' && (!r.customSplits || !r.customSplits[p.id])) return '';
                    let memberAmt = (r.type === 'multi') ? (r.amount / state.people.length) : r.customSplits[p.id];
                    const formattedAmt = Number.isInteger(memberAmt) ? memberAmt.toLocaleString() : memberAmt.toLocaleString(undefined, {minimumFractionDigits: 2});
                    const ok = r.settledIds?.includes(p.id);
                    const btnStyle = ok ? 'bg-emerald-500 text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200';
                    const textStyle = ok ? 'line-through opacity-80' : '';
                    const iconHtml = ok ? '<i class="fa-solid fa-check text-[10px] ml-1"></i>' : '';

                    return `<button onclick="toggleSettled(${r.id},'${p.id}')" class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold transition-all flex items-center ${btnStyle}"><span class="${textStyle}">${p.name} ${sym}${formattedAmt}</span>${iconHtml}</button>`;
                }).join('');
                if (membersHtml) sharedHtml = `<div class="mt-4 pt-3 border-t border-gray-50 flex flex-wrap gap-2">${membersHtml}</div>`;
            }
            
            // 渲染照片按鈕
            const photoHtml = r.photo ? `<button onclick="openLightbox('${r.photo}'); event.stopPropagation();" class="pointer-events-auto ml-1 w-6 h-6 bg-slate-100 rounded text-slate-400 hover:text-indigo-500 hover:bg-indigo-50 transition-colors flex items-center justify-center"><i class="fa-solid fa-image text-[10px]"></i></button>` : '';

            // 新增 Mouse 事件支援電腦端拖曳操作
            return `<div class="relative rounded-[1.25rem] overflow-hidden bg-slate-100 shadow-sm border border-gray-100 mb-2">
                <div id="card-bg-${r.id}" class="absolute inset-0 flex justify-between items-center px-6 z-0 transition-colors">
                    <div class="text-indigo-600 font-black flex items-center gap-2"><i class="fa-solid fa-pen"></i>修改</div>
                    <div class="text-rose-600 font-black flex items-center gap-2">刪除<i class="fa-solid fa-trash"></i></div>
                </div>
                <div id="card-inner-${r.id}" class="bg-white rounded-[1.25rem] p-4 relative z-10 w-full transition-transform duration-300 cursor-grab active:cursor-grabbing"
                     ontouchstart="handleTouchStart(event, ${r.id})"
                     ontouchmove="handleTouchMove(event, ${r.id})"
                     ontouchend="handleTouchEnd(event, ${r.id})"
                     onmousedown="handleTouchStart(event, ${r.id})"
                     onmousemove="handleTouchMove(event, ${r.id})"
                     onmouseup="handleTouchEnd(event, ${r.id})"
                     onmouseleave="handleTouchEnd(event, ${r.id})">
                    <div class="flex items-center justify-between pointer-events-none"><div class="flex items-center gap-4"><div class="w-10 h-10 rounded-full bg-${colorVal}-50 flex items-center justify-center shrink-0"><i class="fa-solid ${isIncome ? 'fa-arrow-down' : 'fa-arrow-up'} text-${colorVal}-400 text-lg"></i></div><div><div class="flex items-center gap-2 mb-0.5"><h4 class="font-bold text-gray-800 text-base">${r.title}</h4>${photoHtml}<span class="text-[10px] font-bold px-2 py-0.5 rounded ${payMethodColor}">${payMethodName}</span></div><div class="text-xs text-gray-400">${r.payMethod === 'public' ? '公費款項' : (isShared ? `${state.people.find(p=>p.id==r.payerId)?.name} 負責` : `個人紀錄`)}</div></div></div><div class="text-right text-xl font-medium text-${colorVal}-500">${isIncome?'+':''}${sym}${r.amount.toLocaleString()}</div></div>
                    <div class="pointer-events-auto">${sharedHtml}</div>
                </div>
            </div>`;
        }).join('') + `</div></div>`;
    }).join('');
}

// --- 手勢滑動 (Swipe) 邏輯 (支援 Mouse 與 Touch) ---
let touchStartX = 0;
let touchCurrentX = 0;
let swipingCardId = null;
let isSwiping = false;

window.handleTouchStart = function(e, id) {
    if (e.target.closest('button')) return;
    
    // 依據事件類型抓取正確的 X 座標
    touchStartX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
    swipingCardId = id;
    isSwiping = true;
    
    const el = document.getElementById(`card-inner-${id}`);
    if(el) { el.style.transition = 'none'; }
};

window.handleTouchMove = function(e, id) {
    if (swipingCardId !== id || !isSwiping) return;
    
    // 如果是電腦滑鼠操作，防止拖曳時反白選取文字
    if (e.type.includes('mouse')) {
        e.preventDefault();
    }
    
    touchCurrentX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
    const diffX = touchCurrentX - touchStartX;
    const el = document.getElementById(`card-inner-${id}`);
    
    if(el) {
        let moveX = diffX;
        if(moveX > 100) moveX = 100;
        if(moveX < -100) moveX = -100;
        
        el.style.transform = `translateX(${moveX}px)`;
        
        const bgEl = document.getElementById(`card-bg-${id}`);
        if (bgEl) {
            if (moveX > 40) bgEl.className = 'absolute inset-0 flex justify-between items-center px-6 z-0 transition-colors bg-indigo-50';
            else if (moveX < -40) bgEl.className = 'absolute inset-0 flex justify-between items-center px-6 z-0 transition-colors bg-rose-50';
            else bgEl.className = 'absolute inset-0 flex justify-between items-center px-6 z-0 transition-colors bg-slate-100';
        }
    }
};

window.handleTouchEnd = function(e, id) {
    // 即使游標滑出(mouseleave)也要能正確中斷，確保不卡死
    if (swipingCardId !== id || !isSwiping) return;
    isSwiping = false;
    
    const diffX = touchCurrentX - touchStartX;
    const el = document.getElementById(`card-inner-${id}`);

    if(el) {
        el.style.transition = 'transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1)';
        
        if (diffX > 60) {
            el.style.transform = `translateX(100%)`; 
            setTimeout(() => { editRecord(id); el.style.transform = 'translateX(0)'; }, 200);
        } else if (diffX < -60) {
            el.style.transform = `translateX(-100%)`;
            setTimeout(() => { deleteRecord(id); el.style.transform = 'translateX(0)'; }, 200);
        } else {
            el.style.transform = `translateX(0)`;
        }
    }
    
    swipingCardId = null;
    touchStartX = 0;
    touchCurrentX = 0;
};

        }

        function updateAmountDisplay() {
            const parts = state.currentAmount.split('.');
            document.getElementById('amount-display').innerText = parseInt(parts[0]).toLocaleString() + (parts[1] ? '.'+parts[1] : '');
            if (state.currentType === 'multi' && state.people.length > 0) document.getElementById('avg-amount').innerText = (parseFloat(state.currentAmount)/state.people.length).toFixed(2);
            if (state.currentType === 'custom') renderCustomSplitInputs();
        }

        function calcInput(v) {
            if (v === 'C') state.currentAmount = '0';
            else if (v === 'DEL') state.currentAmount = state.currentAmount.length <= 1 ? '0' : state.currentAmount.slice(0, -1);
            else if (v === '.') { if (!state.currentAmount.includes('.')) state.currentAmount += '.'; }
            else state.currentAmount = state.currentAmount === '0' ? v : state.currentAmount + v;
            updateAmountDisplay();
        }

        function setExpenseType(t) {
            state.currentType = t;
            ['single','multi','custom'].forEach(id => {
                document.getElementById('type-'+id).className = (t === id ? 'py-3 rounded-xl font-black text-xs transition-all bg-white shadow-sm text-indigo-600' : 'py-3 rounded-xl font-black text-xs transition-all text-slate-400');
            });
            document.getElementById('split-info').style.display = t === 'multi' ? 'block' : 'none';
            document.getElementById('custom-split-container').style.display = t === 'custom' ? 'flex' : 'none';
            updateAmountDisplay();
        }

        function renderCustomSplitInputs() {
            const container = document.getElementById('custom-split-inputs'); container.innerHTML = '';
            const sym = getCurrencySymbol(document.getElementById('currency-select').value);
            const colorClass = state.currentFlowType === 'income' ? 'text-emerald-600' : 'text-rose-600';
            state.people.forEach(p => {
                container.innerHTML += `<div class="flex justify-between items-center bg-white p-2.5 rounded-xl border border-slate-100"><span class="text-sm font-bold text-slate-700 pl-2">${p.name}</span><div class="flex items-center gap-1"><span class="text-slate-300 font-bold">${sym}</span><input type="number" value="${state.customSplits[p.id]||''}" oninput="state.customSplits['${p.id}']=parseFloat(this.value)||0;calculateCustomDiff()" class="w-24 bg-slate-50 p-1.5 rounded-lg text-right font-black ${colorClass}"></div></div>`;
            });
            calculateCustomDiff();
        }

        function calculateCustomDiff() {
            const total = parseFloat(state.currentAmount) || 0;
            const current = Object.values(state.customSplits).reduce((a,b)=>a+b, 0);
            const diff = total - current;
            const el = document.getElementById('custom-split-diff');
            if (Math.abs(diff) < 0.01) { el.innerText = '✅ 金額吻合'; el.className = 'text-[10px] px-2 py-1 rounded font-bold bg-emerald-100 text-emerald-600'; }
            else { el.innerText = `差額: ${diff.toFixed(2)}`; el.className = 'text-[10px] px-2 py-1 rounded font-bold bg-rose-100 text-rose-600'; }
        }

        function setPayMethod(m) {
            state.currentPayMethod = m;
            document.getElementById('pay-cash').className = m === 'cash' ? 'py-4 rounded-xl border-2 font-black text-xs flex flex-col items-center justify-center gap-1.5 border-amber-200 bg-amber-50 text-amber-600 transition-all' : 'py-4 rounded-xl border-2 font-black text-xs flex flex-col items-center justify-center gap-1.5 border-slate-50 text-slate-400 bg-white transition-all';
            document.getElementById('pay-credit').className = m === 'credit' ? 'py-4 rounded-xl border-2 font-black text-xs flex flex-col items-center justify-center gap-1.5 border-blue-200 bg-blue-50 text-blue-600 transition-all' : 'py-4 rounded-xl border-2 font-black text-xs flex flex-col items-center justify-center gap-1.5 border-slate-50 text-slate-400 bg-white transition-all';
            document.getElementById('pay-public').className = m === 'public' ? 'py-4 rounded-xl border-2 font-black text-xs flex flex-col items-center justify-center gap-1.5 border-indigo-200 bg-indigo-50 text-indigo-600 transition-all' : 'py-4 rounded-xl border-2 font-black text-xs flex flex-col items-center justify-center gap-1.5 border-slate-50 text-slate-400 bg-white transition-all';
        }

        function renderPayerGrid() {
            const grid = document.getElementById('payer-grid'); grid.innerHTML = '';
            state.people.forEach(p => {
                grid.innerHTML += `<button onclick="state.currentPayerId='${p.id}';renderPayerGrid()" class="px-5 py-2.5 rounded-xl text-xs font-black transition-all ${state.currentPayerId==p.id?'bg-slate-800 text-white':'bg-white border border-slate-200 text-slate-500'}">${p.name}</button>`;
            });
        }

        async function calcSave() {
            const dateInput = document.getElementById('item-date').value;
            const title = document.getElementById('item-title').value.trim() || '未分類紀錄';
            const amount = parseFloat(state.currentAmount);
            if (!dateInput || amount <= 0) { showCustomModal('alert', '請輸入正確金額與日期'); return; }
            
            const record = {
                id: state.editingId || Date.now(),
                date: `${new Date(dateInput).getFullYear()}/${new Date(dateInput).getMonth()+1}/${new Date(dateInput).getDate()}`, 
                title, amount, currency: document.getElementById('currency-select').value,
                flowType: state.currentFlowType, 
                type: state.currentType, payMethod: state.currentPayMethod, payerId: state.currentPayerId,
                customSplits: state.currentType === 'custom' ? {...state.customSplits} : null,
                settledIds: state.editingId ? state.records.find(r=>r.id===state.editingId).settledIds : [],
                photo: state.currentPhoto // 存入壓縮後的 Base64 照片
            };

            if (state.editingId) state.records[state.records.findIndex(r=>r.id===state.editingId)] = record;
            else state.records.unshift(record);

            saveLocalState(false); 
            showView('main');
            
            // 存檔即全自動靜默上傳 (利用 isAuto=true 抑制彈出視窗)
            if (syncConfig.token) {
                await uploadToGitHub(true);
            }
        }

        async function deleteRecord(id) { showCustomModal('confirm', '確定要刪除嗎？', async () => { state.records = state.records.filter(r=>r.id!==id); saveLocalState(false); renderRecords(); updateSummary(); renderMemberSummary(); updatePublicFundDashboard(); if (syncConfig.token) { await uploadToGitHub(true); } }); }
        function editRecord(id) { state.editingId = id; showView('add'); }
        async function toggleSettled(recId, pId) { const r = state.records.find(rec=>rec.id===recId); r.settledIds = r.settledIds || []; const idx = r.settledIds.indexOf(pId); if (idx > -1) r.settledIds.splice(idx,1); else r.settledIds.push(pId); saveLocalState(false); renderRecords(); if (syncConfig.token) { await uploadToGitHub(true); } }
        
        // --- Utils ---
        function saveLocalState(isFromCloud = false) {
            localStorage.setItem('travel_split_state', JSON.stringify({ people: state.people, records: state.records }));
            if (!isFromCloud) { hasUnsyncedChanges = true; saveSyncStatus(); updateCloudStatusUI(); }
        }

        function loadLocalState() {
            const saved = localStorage.getItem('travel_split_state');
            if (saved) { const p = JSON.parse(saved); state.people = p.people || []; state.records = p.records || []; }
        }

        function showCustomModal(type, msg, confirm = null, title = null) {
            const modal = document.getElementById('custom-modal'), panel = document.getElementById('custom-modal-panel');
            document.getElementById('modal-message').innerText = msg; document.getElementById('modal-title').innerText = title || '系統提示'; document.getElementById('modal-cancel').style.display = type === 'confirm' ? 'block' : 'none';
            pendingModalAction = confirm; modal.classList.remove('hidden'); modal.classList.add('flex');
            requestAnimationFrame(() => { modal.classList.remove('opacity-0'); panel.classList.remove('scale-95'); });
        }

        function closeCustomModal() {
            const modal = document.getElementById('custom-modal'), panel = document.getElementById('custom-modal-panel');
            modal.classList.add('opacity-0'); panel.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); pendingModalAction = null; }, 300);
        }

        function executeModalAction() { if (pendingModalAction) pendingModalAction(); closeCustomModal(); }
        function exportLocalJSON() { const dl = document.createElement('a'); dl.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2))); dl.setAttribute("download", "TravelSplit.json"); dl.click(); }
        function importLocalJSON(event) { const reader = new FileReader(); reader.onload = (e) => { const p = JSON.parse(e.target.result); if (p && p.people) { state = {...state, ...p}; saveLocalState(true); initApp(); } }; reader.readAsText(event.target.files[0]); }
    </script>
</body>
</html>
